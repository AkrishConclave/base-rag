# Production Docker Compose
# Использование: docker-compose -f docker-compose.prod.yml up -d
# В продакшене используется только Docker image, без volume кода

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    volumes:
      - ../chroma_db:/chromadb/data
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8001:8000"
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rag-network
    command: redis-server --appendonly yes

  rag_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: base-rag-api:latest
    container_name: rag_api
    restart: unless-stopped
    # В prod НЕ монтируем код - только образ
    volumes:
      - ../chroma_db:/chroma_db
      - hf-cache:/models/huggingface
    env_file:
      - ../deployment/prod.env
    environment:
      - PYTHONPATH=/app
      # Keep Chroma's persistent index in the mounted host directory.
      - CHROMA_DIR=/chroma_db
    ports:
      - "9001:9001"
    depends_on:
      - chroma
      - redis
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis-data:
  hf-cache:

networks:
  rag-network:
    driver: bridge

