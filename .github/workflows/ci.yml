name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        # sentence-transformers depends on torch. Install its CPU wheel first so
        # the resolver does not select PyPI's CUDA-enabled Linux wheel.
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -r requirements.txt pytest
        pip install flake8
        pip install ..

    - name: Verify CPU-only PyTorch
      working-directory: ./api
      run: |
        python -c "import torch; assert not torch.cuda.is_available(), 'CUDA-enabled torch is not allowed in CI'"
        if pip freeze | grep -E '^(nvidia-|cuda-)'; then
          echo 'CUDA packages are not allowed in the CPU-only CI environment.'
          exit 1
        fi
    
    - name: Run flake8 (critical errors only)
      working-directory: ./api
      run: |
        flake8 . --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests
      working-directory: .
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: pytest api/tests -q
