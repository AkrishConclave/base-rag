name: CI - Minimal Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install linting tools
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Run flake8 (critical errors only)
      working-directory: ./api
      run: |
        # Проверяем только критические ошибки синтаксиса
        flake8 . --select=E9,F63,F7,F82 --show-source --statistics || true
      continue-on-error: true
