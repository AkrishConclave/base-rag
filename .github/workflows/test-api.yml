name: Test API Endpoints

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-api:
    name: Test API Endpoints
    runs-on: ubuntu-latest
    
    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx
        pip install -r requirements.txt
    
    - name: Create test .env file
      working-directory: ./api
      run: |
        cat > .env << EOF
        OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || 'test-key' }}
        OPENROUTER_MODEL=deepseek/deepseek-chat
        CHROMA_DIR=./test_chroma_db
        EMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
        LOG_LEVEL=INFO
        CACHE_ENABLED=true
        CACHE_TYPE=sqlite
        EOF
    
    - name: Start API server
      working-directory: ./api
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE}"
        python -m uvicorn api.main:app --host 0.0.0.0 --port 9001 &
        sleep 15
      env:
        PYTHONPATH: ${{ github.workspace }}
    
    - name: Test Health Check
      run: |
        curl -f http://localhost:9001/health || exit 1
        echo "✅ Health check passed"
    
    - name: Test API endpoints
      run: |
        # Тест Swagger UI
        curl -f http://localhost:9001/docs || exit 1
        echo "✅ Swagger UI accessible"
        
        # Тест что API отвечает (без реального запроса к LLM)
        curl -f http://localhost:9001/health || exit 1
        echo "✅ API is running"
    
    - name: Check API structure
      working-directory: ./api
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE}"
        python -c "
        try:
            from api.main import app
            from api.config import settings
            print('✅ App imports successfully')
            print(f'✅ Config loaded: {settings.llm_provider}')
        except Exception as e:
            print(f'⚠️  Import error: {e}')
            import traceback
            traceback.print_exc()
            exit(1)
        "
      env:
        PYTHONPATH: ${{ github.workspace }}

