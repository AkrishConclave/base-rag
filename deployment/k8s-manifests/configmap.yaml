apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-support-config
data:
  YANDEX_CLOUD_MODEL: "deepseek-v4-flash/latest"
  YANDEX_CLOUD_BASE_URL: "https://ai.api.cloud.yandex.net/v1"
  YANDEX_CLOUD_TEMPERATURE: "0.3"
  YANDEX_CLOUD_MAX_OUTPUT_TOKENS: "65536"
  CHROMA_DIR: "/data/chroma_db"
  CHROMA_COLLECTION_NAME: "support_articles"
  EMBED_MODEL: "intfloat/multilingual-e5-small"
  TOP_K: "10"
  MAX_DISTANCE: "0.8"
  LLM_PROVIDER: "yandex_ai_studio"
  LOG_LEVEL: "INFO"
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"
  CACHE_TYPE: "redis"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

